apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server-v2
  namespace: banking-v2
  labels:
    app: config-server-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server-v2
  template:
    metadata:
      labels:
        app: config-server-v2
    spec:
      containers:
        - name: config-server
          image: banking-config-server:v2-local
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "v2"
          ports:
            - name: http
              containerPort: 8888
          readinessProbe:
            tcpSocket:
              port: 8888
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8888
            initialDelaySeconds: 45
            periodSeconds: 20
