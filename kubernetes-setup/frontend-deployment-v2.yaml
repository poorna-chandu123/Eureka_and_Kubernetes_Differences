apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-v2
  namespace: banking-v2
  labels:
    app: frontend-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-v2
  template:
    metadata:
      labels:
        app: frontend-v2
    spec:
      containers:
        - name: frontend
          image: banking-frontend:v2-local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4200
          readinessProbe:
            tcpSocket:
              port: 4200
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 4200
            initialDelaySeconds: 45
            periodSeconds: 20
