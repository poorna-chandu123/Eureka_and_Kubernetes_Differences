apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-v2
  namespace: banking-v2
  labels:
    app: api-gateway-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway-v2
  template:
    metadata:
      labels:
        app: api-gateway-v2
    spec:
      containers:
        - name: api-gateway
          image: banking-api-gateway:v2-fix2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9090
          env:
            - name: SPRING_CONFIG_IMPORT
              value: "configserver:http://config-server-v2:8888"
            - name: EUREKA_CLIENT_ENABLED
              value: "false"
            - name: EUREKA_CLIENT_REGISTER_WITH_EUREKA
              value: "false"
            - name: EUREKA_CLIENT_FETCH_REGISTRY
              value: "false"
            - name: SPRING_PROFILES_ACTIVE
              value: "v2"
          startupProbe:
            tcpSocket:
              port: 9090
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 9090
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 9090
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
