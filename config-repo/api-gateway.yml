server:
  port: 9090

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-server
              uri: lb://AUTH-SERVER
              predicates:
                - Path=/api/auth/**

            - id: customer-service
              uri: lb://CUSTOMER-SERVICE
              predicates:
                - Path=/api/customers/**

            - id: account-service
              uri: lb://ACCOUNT-SERVICE
              predicates:
                - Path=/api/accounts/**

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/     #changed http://localhost to http://discovery-server in the part of Docker Compose if i want to run intelij i need to change this agin 
    register-with-eureka: true
    fetch-registry: true

app:
  jwt:
